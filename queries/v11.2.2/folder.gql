query folderContents ($folderPath: String!, $includeAllDependencies: Boolean = false, $includePolicyRevisions: Boolean = false) {
    servicesByFolderPath (folderPath: $folderPath) {
        {{L7Service:-policy}}
        policy {
            xml
            allDependencies @include (if: $includeAllDependencies) {
                {{PolicyDependency:-policyFragments,-dtds,-schemas,-internalIdps,-internalUsers,-internalGroups,-fips,-fipUsers,-fipGroups,-federatedIdps,-federatedUsers,-federatedGroups,-ldaps,-ldapIdps,-simpleLdapIdps,-policyBackedIdps}}
            }
        }
        policyRevisions @include (if: $includePolicyRevisions) {
            {{PolicyRevision}}
        }
    }

	encassConfigsByFolderPath (folderPath: $folderPath) {
        {{EncassConfig}}
    }

	policiesByFolderPath (folderPath: $folderPath) {
        {{L7Policy:-policy}}
        policy {
            xml
            allDependencies @include (if: $includeAllDependencies) {
                {{PolicyDependency:-policyFragments,-dtds,-schemas,-internalIdps,-internalUsers,-internalGroups,-fips,-fipUsers,-fipGroups,-federatedIdps,-federatedUsers,-federatedGroups,-ldaps,-ldapIdps,-simpleLdapIdps,-policyBackedIdps}}
            }
        }
        policyRevisions @include (if: $includePolicyRevisions) {
            {{PolicyRevision}}
        }
    }

    policyAliasesByFolderPath (folderPath: $folderPath) {
        {{L7PolicyAlias}}
    }

    serviceAliasesByFolderPath (folderPath: $folderPath) {
        {{L7ServiceAlias}}
    }
}
